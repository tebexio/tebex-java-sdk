# Publishes :tbx and :headless-api to Maven Central via the Central Portal.
#
# Runs on every push to main, e.g. a merged version-bump PR — as well as
# on-demand from the Actions tab. Either way it only ever stages the deployment
# (`publishToMavenCentral`, not `publishAndReleaseToMavenCentral`): a Central
# Portal deployment can be released but never un-released, so an actual push to
# main should not be able to make a mistake permanent by itself. Someone still
# has to review and click Publish on the staged deployment at
# central.sonatype.com — or re-run this workflow manually with the
# "automaticRelease" input checked, which does both steps at once.
#
# Requires these repository secrets (see build.gradle.kts and
# https://vanniktech.github.io/gradle-maven-publish-plugin/central/):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — a Central Portal user
#     token (Account -> Generate User Token), not a Sonatype account password.
#   SIGNING_IN_MEMORY_KEY / SIGNING_IN_MEMORY_KEY_ID / SIGNING_IN_MEMORY_KEY_PASSWORD
#     — an ASCII-armored PGP private key (and its id/passphrase) whose public
#     key has been published to a keyserver, dedicated to release signing.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      automaticRelease:
        description: >-
          Publish straight to Maven Central (publishAndReleaseToMavenCentral).
          Leave unchecked to stage the deployment and release it by hand from
          central.sonatype.com after reviewing it there. Ignored on a plain
          push to main, which always stages only.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish (staged)
        if: ${{ github.event_name == 'push' || !inputs.automaticRelease }}
        run: ./gradlew publishToMavenCentral --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Publish and release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.automaticRelease }}
        run: ./gradlew publishAndReleaseToMavenCentral --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
