# Increases the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# NOTE: deliberately no org.gradle.configureondemand here. In Tebex-Minecraft that
# flag existed to stop :tbx:test from configuring the ForgeGradle platform modules
# (whose Minecraft Mavenizer needs network access at configuration time). This build
# contains no such modules, so the flag has nothing to buy — and it is deprecated in
# Gradle 9.
